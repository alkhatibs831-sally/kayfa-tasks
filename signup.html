<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <form action="" method="POST">
        
        <label for="name">Full Name:</label>
        <input type="text" name="fullname" required minlength="3" maxlength="30">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" name="password">
        <br><br>

        <label for="website">Website:</label>
        <input type="url" name="website">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" name="age">
        <br><br>

        <label for="date">Birthday:</label>
        <input type="date" name="birthday">
        <br><br>

        <label for="country">Country:</label>
        <select name="country">
            <optgroup label="countries">
                <option value="syria">Syria</option>
                <option value="uae">UAE</option>
                <option value="egypt">Egypt</option>
            </optgroup>
        </select>
        <br><br>

        <label for="note">Notes:</label><br>
        <textarea name="notes" rows="4" cols="40">Write your notes here..</textarea>
        <br><br>

        <label for="files">files</label>
        <input type="file" name="documents" multiple>
        <br><br>

        <input type="hidden" name="your name" value="standard">

        <label for="text"> Code (5 digits):</label>
        <input type="text" name="code" pattern="[0-9]{5}" title="Please enter a 5-digit (numbers only)">
        <br><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" name="gender" value="male">
        <label for="male">Male</label>
        
        <input type="radio" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>

        <label for="text">Hobbies:</label><br>
        <input type="checkbox" name="hobbies" value="coding">
        <label for="text">Coding</label>

        <input type="checkbox" name="hobbies" value="gaming">
        <label for="text">Gaming</label>

        <input type="checkbox" name="hobbies" value="reading">
        <label for="text">Reading</label>
        <br><br>

        <button type="submit">Submit</button>
        <button type="button">Restart</button>

    </form>

</body>
</html>
